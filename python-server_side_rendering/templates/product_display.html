<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% if error %}
    <p class="error">{{ error }}</p>
{% else %}
    <table>
        ...your existing thead...
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.name }}</td>
                <td>{{ product.category }}</td>
                <td class="price">${{ "%.2f"|format(product.price) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endif %}
</body>
</html>
